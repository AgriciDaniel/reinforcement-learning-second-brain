# Brainstein spec v3
spec_version: 3
slug: "reinforcement-learning-brain"
title: "Reinforcement Learning Brain"
domain: "reinforcement learning: fundamentals, deep RL, RLHF/RLAIF and preference optimization, evaluation, tooling, and applied best practices"
buyer: "ML engineers, researchers, and AI builders who need repeatable, source-cited reinforcement learning decisions, from classic RL through modern LLM post-training."
owner: "Daniel Agrici"
repo_url: "https://github.com/AgriciDaniel/reinforcement-learning-second-brain"
license_name: "Custom license"
research_refresh_cadence: "monthly for fast-moving sources (LLM post-training, libraries); before every release for canonical claims"
workflows:
  - "Source intake and provenance capture for papers, docs, and courses"
  - "Source quality review and claim verification"
  - "Algorithm selection and training-run decision drafting"
  - "RLHF / preference-optimization pipeline review"
  - "Experiment debugging and reproducibility review"
  - "Weekly research-refresh and next-action review"
raw_sources:
  - "Papers (arXiv PDFs), official library docs, course notes, experiment logs, training configs, and TensorBoard/W&B exports supplied by the operator"
enrichment_sources:
  - "Sutton & Barto, Reinforcement Learning: An Introduction (2nd ed.)"
  - "OpenAI Spinning Up in Deep RL"
  - "Hugging Face Deep RL Course and TRL documentation"
  - "Original algorithm papers: DQN, PPO, SAC, TD3, A3C, AlphaZero, MuZero, InstructGPT, DPO, GRPO"
  - "Official library documentation: Gymnasium, Stable-Baselines3, RLlib, CleanRL, TRL, veRL/OpenRLHF"
  - "Anthropic, OpenAI, and DeepMind research publications on RLHF, RLAIF, and Constitutional AI"
deliverables:
  - "Algorithm selection guide"
  - "RLHF / post-training pipeline playbook"
  - "Debugging and reproducibility checklist"
  - "Evaluation and benchmark scorecard"
  - "Weekly research-refresh report"
refusal_rules:
  - "No unsourced claims about algorithm performance, benchmarks, or state of the art"
  - "No credentials, tokens, API keys, or private training data in repo artifacts"
  - "No claims of a universal best algorithm; recommendations must state task assumptions"
  - "No presenting contested or folklore practices as evidence-based without labeling"
safety_risks:
  - "Stale state-of-the-art claims in a fast-moving field"
  - "Reward hacking and specification gaming presented without caveats"
  - "Overconfident synthesis from single papers or unreproduced results"
  - "Benchmark numbers quoted without seed variance and evaluation-protocol context"
playbook_steps:
  - "Capture canonical sources (textbooks, original papers, official docs) with retrieval dates before any current claim"
  - "Build the concept canon: MDPs, value/policy methods, deep RL, policy gradients, model-based RL, offline RL, multi-agent RL, RLHF and preference optimization"
  - "Adapt importers to operator experiment logs and configs"
  - "Generate algorithm-selection and debugging syntheses with sourced citations"
  - "Verify demo determinism with sample-vault hashing"
  - "Run market-ready audit before tagging release"
audit_focus:
  - "source-ledger freshness for post-training and library claims"
  - "claim coverage for benchmark and comparative statements"
  - "deliverable citation coverage"
next_action_signals:
  - "stale refresh_due > 30 days"
  - "open critical audit failure"
  - "canon note below line floor or missing sources"
claim_ledger_policy: "single-source marked; second source preferred"
second_source_policy: "required for benchmark, comparative, numeric, state-of-the-art, and high-stakes claims"
source_refresh_days: 30
confidence_policy: "evidence-based, practitioner, contested, folklore"
canon_seed_count: 34
canon_targets:
  - "Markov decision processes and the RL problem formulation"
  - "Bandits and exploration-exploitation"
  - "Dynamic programming, Monte Carlo, and temporal-difference learning"
  - "Q-learning, SARSA, and tabular methods"
  - "Function approximation and the deadly triad"
  - "Deep Q-Networks and value-based deep RL (DQN, Rainbow)"
  - "Policy gradient methods and REINFORCE"
  - "Actor-critic methods (A2C/A3C, GAE)"
  - "Trust-region and proximal methods (TRPO, PPO)"
  - "Continuous control (DDPG, TD3, SAC)"
  - "Model-based RL and planning (Dyna, MBPO, AlphaZero, MuZero)"
  - "Exploration strategies and intrinsic motivation"
  - "Offline / batch RL and conservatism"
  - "Multi-agent RL"
  - "Hierarchical RL and options"
  - "Imitation learning and inverse RL"
  - "Reward design, reward hacking, and specification gaming"
  - "RLHF: reward models and PPO post-training (InstructGPT lineage)"
  - "Direct preference optimization family (DPO, IPO, KTO, ORPO)"
  - "GRPO and RL with verifiable rewards for reasoning models"
  - "RLAIF and Constitutional AI"
  - "Evaluation, benchmarks, and reproducibility in deep RL"
  - "Debugging RL training runs in practice"
  - "RL tooling landscape (Gymnasium, SB3, CleanRL, RLlib, TRL, veRL, OpenRLHF)"
  - "Agentic multi-turn RL for LLM agents"
  - "Process reward models and step-level supervision"
  - "World models and latent imagination (Dreamer, Genie)"
  - "Test-time compute and search for reasoning models"
  - "POMDPs and partial observability"
  - "Meta-RL, generalization, and curricula"
  - "Safe and constrained RL"
  - "Distributed RL systems and self-play (IMPALA, Ape-X, league training)"
  - "Sim-to-real and robotics RL"
  - "Distributional RL"
canon_fold_targets:
canon_note_floor: 80
note_line_floor: 80
wikilink_target: 8
seed_gaps:
  - "Evidence coverage not yet verified"
  - "Post-training (2024-2026) claims need dated primary sources"
seed_questions:
  - "When does DPO-family training beat PPO-based RLHF, and on what evidence?"
  - "What are the reproducibility pitfalls that most often invalidate deep RL comparisons?"
  - "Which current official source resolves the highest-risk state-of-the-art claim?"
seed_experiments:
  - "Source-to-claim spot-check probe on benchmark numbers"
  - "CleanRL PPO reproduction sanity run as a determinism probe"
flow_playbooks:
  - "Claim Verification Flow"
  - "Explore Plan Code Commit"
  - "Multi-Agent Fan-Out Research Flow"
  - "Context Compaction Routine"
verification_modes:
  - "tool-result audit"
  - "fresh-context verifier"
  - "claim-ledger review"
eval_seed_count: 20
secretary_mode: "single"
curator_themes:
  - "classic RL foundations"
  - "deep RL algorithms"
  - "LLM post-training and preference optimization"
  - "evaluation and reproducibility"
  - "tooling and engineering practice"
publish_surface: "sanitized-quartz"
public_exclude_patterns:
  - ".raw"
  - ".obsidian"
  - "hot.md"
  - "log.md"
  - "references/source-ledger.json"
  - "references/claim-ledger.md"
public_content_policy: "publish summaries, links, and compliant short quotes only"
corpus_scope_policy: "each corpus note states harness, date, source, and non-scope"
context_budget_policy: "hot cache plus progress file plus just-in-time retrieval"
retrieval_pattern: "wiki plus hybrid search plus graph traversal"
provenance_trace_policy: "source to claim to note to decision to deliverable"
memory_governance_policy: "write, store, retrieve, execute, share, forget, rollback"
mutation_policy: "advisory-read-only-v1"
adapter_domain_depth: "schemas plus importers plus synthesis plus renderers plus fixtures plus tests"
live_api_spend_cap_usd: 0
answer_engine_policy: "useful crawlable primary-source passages, no GEO hacks"
substance_profile: "fable-grade"
uncertainty_eval_policy: "reward no data; penalize confident unsupported answers"
